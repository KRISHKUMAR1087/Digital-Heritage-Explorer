<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#3B2A1A"/>
  <rect x="50" y="50" width="700" height="400" fill="#FAF5EC" rx="6"/>
  <!-- Jali lattice pattern -->
  <g stroke="#C9A36B" stroke-width="4" fill="none">
    <pattern id="jaliPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#3B2A1A"/>
      <circle cx="20" cy="20" r="14" stroke="#C9A36B" stroke-width="3" fill="#FAF5EC"/>
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="#B5502F" stroke-width="2"/>
    </pattern>
    <rect x="100" y="80" width="600" height="300" fill="url(#jaliPattern)" stroke="#3B2A1A" stroke-width="8"/>
  </g>
  <text x="400" y="425" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#3B2A1A" text-anchor="middle">Sultanate Geometric Jali Lattice Window Screen</text>
</svg>
