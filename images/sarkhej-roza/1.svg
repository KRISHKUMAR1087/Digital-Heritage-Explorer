<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#FAF5EC"/>
  
  <!-- Lake Reflection Area -->
  <rect x="0" y="300" width="800" height="200" fill="#3B7A87" opacity="0.8"/>
  
  <!-- Mosque Domes and Pavilion -->
  <!-- Main Central Dome -->
  <path d="M 330 200 A 70 70 0 0 1 470 200 Z" fill="#C9A36B"/>
  <rect x="330" y="200" width="140" height="100" fill="#FAF5EC" stroke="#3B2A1A" stroke-width="2"/>
  
  <!-- Left Pavilion Domes -->
  <path d="M 160 220 A 50 50 0 0 1 260 220 Z" fill="#C9A36B"/>
  <rect x="160" y="220" width="100" height="80" fill="#FAF5EC" stroke="#3B2A1A" stroke-width="2"/>
  
  <!-- Right Pavilion Domes -->
  <path d="M 540 220 A 50 50 0 0 1 640 220 Z" fill="#C9A36B"/>
  <rect x="540" y="220" width="100" height="80" fill="#FAF5EC" stroke="#3B2A1A" stroke-width="2"/>
  
  <!-- Arches along facade -->
  <g fill="#3B2A1A">
    <path d="M 180 300 L 180 260 Q 210 240 240 260 L 240 300 Z"/>
    <path d="M 360 300 L 360 250 Q 400 230 440 250 L 440 300 Z"/>
    <path d="M 560 300 L 560 260 Q 590 240 620 260 L 620 300 Z"/>
  </g>

  <!-- Reflection -->
  <path d="M 330 400 A 70 70 0 0 0 470 400 Z" fill="#C9A36B" opacity="0.3"/>
  <text x="400" y="480" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FAF5EC" text-anchor="middle">Sarkhej Roza Palace &amp; Lake Reflection</text>
</svg>
