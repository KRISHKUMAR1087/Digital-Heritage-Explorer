<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#3B2A1A"/>
  <!-- Indus Script Signboard Replica -->
  <rect x="80" y="80" width="640" height="180" fill="#C9A36B" stroke="#B5502F" stroke-width="8" rx="8"/>
  
  <!-- Indus Script Glyphs / Symbols -->
  <g fill="none" stroke="#FAF5EC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Symbol 1: Wheel/Spoke -->
    <circle cx="160" cy="170" r="35"/>
    <line x1="160" y1="135" x2="160" y2="205"/>
    <line x1="125" y1="170" x2="195" y2="170"/>
    
    <!-- Symbol 2: Horned Fish -->
    <path d="M 250 140 C 300 130 300 210 250 200 Z"/>
    <line x1="270" y1="120" x2="250" y2="140"/>
    
    <!-- Symbol 3: Jar/Vessel -->
    <path d="M 350 140 L 410 140 L 410 190 Q 380 210 350 190 Z"/>
    <line x1="380" y1="125" x2="380" y2="140"/>
    
    <!-- Symbol 4: Trident / Man -->
    <line x1="490" y1="135" x2="490" y2="205"/>
    <path d="M 460 160 L 490 190 L 520 160"/>
    
    <!-- Symbol 5: Double Arch -->
    <path d="M 570 200 A 25 25 0 0 1 620 200"/>
    <path d="M 600 200 A 25 25 0 0 1 650 200"/>
  </g>
  
  <!-- Citadel Street Ruins below -->
  <rect x="80" y="300" width="640" height="130" fill="#FAF5EC" rx="4"/>
  <rect x="120" y="320" width="80" height="90" fill="#D8B57F"/>
  <rect x="230" y="320" width="80" height="90" fill="#D8B57F"/>
  <rect x="340" y="320" width="80" height="90" fill="#D8B57F"/>
  <rect x="450" y="320" width="80" height="90" fill="#D8B57F"/>
  <rect x="560" y="320" width="80" height="90" fill="#D8B57F"/>

  <text x="400" y="460" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FAF5EC" text-anchor="middle">10-Sign Indus Script Signboard &amp; Citadel Street Layout</text>
</svg>
