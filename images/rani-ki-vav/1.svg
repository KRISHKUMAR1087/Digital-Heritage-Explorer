<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="100%" stop-color="#E8D9C5"/>
    </linearGradient>
    <linearGradient id="sandstoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8B57F"/>
      <stop offset="100%" stop-color="#B38D56"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Stepwell Subterranean Geometry -->
  <polygon points="50,450 750,450 680,180 120,180" fill="#3B2A1A" opacity="0.15"/>
  
  <!-- Level 1 Terraces -->
  <rect x="80" y="220" width="640" height="25" fill="url(#sandstoneGrad)"/>
  <rect x="120" y="270" width="560" height="25" fill="#C9A36B"/>
  <rect x="160" y="320" width="480" height="25" fill="url(#sandstoneGrad)"/>
  <rect x="200" y="370" width="400" height="25" fill="#C9A36B"/>
  <rect x="240" y="420" width="320" height="30" fill="#B5502F"/>

  <!-- Pillars -->
  <g fill="#3B2A1A">
    <rect x="150" y="220" width="14" height="230"/>
    <rect x="250" y="270" width="14" height="180"/>
    <rect x="350" y="320" width="14" height="130"/>
    <rect x="436" y="320" width="14" height="130"/>
    <rect x="536" y="270" width="14" height="180"/>
    <rect x="636" y="220" width="14" height="230"/>
  </g>

  <!-- Carved Motifs & Sun -->
  <circle cx="400" cy="110" r="45" fill="#B5502F" opacity="0.85"/>
  <text x="400" y="480" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#3B2A1A" text-anchor="middle">Rani ki Vav — Subterranean Storeys</text>
</svg>
