<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#3B2A1A"/>
  <rect x="40" y="30" width="720" height="440" fill="#C9A36B" rx="10"/>
  <!-- Sabha Mandapa Carved Pillars -->
  <g fill="#FAF5EC" stroke="#3B2A1A" stroke-width="3">
    <!-- Pillar Left -->
    <rect x="150" y="100" width="60" height="300" rx="4"/>
    <circle cx="180" cy="150" r="20"/>
    <circle cx="180" cy="250" r="20"/>
    <!-- Pillar Right -->
    <rect x="590" y="100" width="60" height="300" rx="4"/>
    <circle cx="620" cy="150" r="20"/>
    <circle cx="620" cy="250" r="20"/>
    <!-- Arch / Torana Archway -->
    <path d="M 210 160 Q 400 40 590 160 Q 400 120 210 160 Z" fill="#B5502F"/>
  </g>
  <text x="400" y="445" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#3B2A1A" text-anchor="middle">Carved Torana Archway &amp; Pillars of Sabha Mandapa</text>
</svg>
